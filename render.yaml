services:
  - type: web
    name: control-cobranza
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: control-cobranza-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_OPEN
        value: "true"

databases:
  - name: control-cobranza-db
    databaseName: control_cobranza
    user: control_cobranza
