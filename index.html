<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b82"><title>Control Cobranza</title><style>
:root{--blue:#0b3b82;--blue2:#145bb5;--bg:#f4f7fb;--card:#fff;--line:#dfe5ee;--text:#172033;--muted:#687386;--ok:#14804a;--warn:#b56a00;--bad:#bd3030}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:linear-gradient(135deg,#082b61,#145bb5);color:#fff;padding:16px}.topin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:850;font-size:21px}.top small{opacity:.85}.who{display:flex;gap:8px;align-items:center}.who button{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:10px;padding:8px 11px}.nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow:auto}.nav button{border:0;background:#fff;padding:13px 15px;color:#536075;white-space:nowrap;font-weight:700}.nav button.active{color:var(--blue);border-bottom:3px solid var(--blue)}main{max-width:1100px;margin:auto;padding:16px}.title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.title h2{margin:0}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 18px #15284d0a}.stat b{display:block;font-size:24px;margin-top:3px}.stat small{color:var(--muted)}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#eef4fc;color:var(--blue)}.danger{background:#fff0f0;color:var(--bad)}.form{display:grid;gap:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:12px;font-weight:700;color:#445067}input,select,textarea{width:100%;border:1px solid #ccd5e2;border-radius:10px;padding:10px;background:#fff;margin-top:4px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.list{display:grid;gap:10px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{padding:4px 8px;border-radius:99px;background:#eef4fc;color:var(--blue);font-size:11px;font-weight:800}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.scroll{overflow:auto}.notice{background:#fff8e7;border:1px solid #f0d58b;padding:10px;border-radius:10px;font-size:12px}.cash{font-size:30px;font-weight:900;color:var(--blue)}.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#071d43,#1565c0)}.loginbox{width:min(420px,100%);background:#fff;border-radius:22px;padding:24px;box-shadow:0 25px 70px #0005}.empty{text-align:center;padding:28px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:20}.modalbox{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.hidden{display:none!important}@media(max-width:720px){main{padding:12px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.topin{align-items:flex-start}.brand{font-size:18px}}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.stat b{font-size:20px}}
</style></head><body><div id="root"></div><script>
const root=document.getElementById('root');let me=null,view='inicio',clients=[],loans=[],collection=[],users=[],cashUsers=[];
const money=n=>'Bs '+Number(n||0).toLocaleString('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error del servidor');return d}
async function boot(){try{const m=await api('/api/me');me=m.user;if(!me){login();return}await load();render()}catch(e){root.innerHTML='<div class="login"><div class="loginbox"><h2>Control Cobranza</h2><p>No se pudo conectar con el servidor.</p><p class="muted">'+esc(e.message)+'</p></div></div>'}}
function login(){root.innerHTML='<div class="login"><div class="loginbox"><h1>🔐 Control Cobranza</h1><p class="muted">Acceso al sistema</p><form class="form" onsubmit="doLogin(event)"><label>Usuario<input id="lu" required autocomplete="username"></label><label>Contraseña<input id="lp" type="password" required autocomplete="current-password"></label><button class="btn primary">Entrar</button><div id="le" class="bad"></div></form></div></div>'}
async function doLogin(e){e.preventDefault();try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:lu.value,password:lp.value})});me=d.user;await load();render()}catch(x){le.textContent=x.message}}
async function load(){[clients,loans,collection]=await Promise.all([api('/api/clients'),api('/api/loans'),api('/api/collection')]);if(me.role==='admin')users=await api('/api/users').catch(()=>[]);}
function nav(){const items=[['inicio','🏠 Inicio'],['clientes','👥 Clientes'],['prestamos','💳 Préstamos'],['cobranza','💰 Cobranza'],['cajas','🧾 Cajas'],['gastos','📤 Gastos'],['reportes','📊 Reportes']];if(me.role==='admin')items.push(['usuarios','⚙️ Usuarios']);return items.map(x=>`<button class="${view===x[0]?'active':''}" onclick="view='${x[0]}';render()">${x[1]}</button>`).join('')}
function shell(body){root.innerHTML=`<header class="top"><div class="topin"><div><div class="brand">Control Cobranza</div><small>Gestión de clientes, préstamos y dinero</small></div><div class="who">👤 ${esc(me.display_name||me.username)} <button onclick="logout()">Salir</button></div></div></header><nav class="nav">${nav()}</nav><main>${body}</main>`}
function render(){if(!me)return login();if(view==='inicio')home();else if(view==='clientes')pageClients();else if(view==='prestamos')pageLoans();else if(view==='cobranza')pageCollection();else if(view==='cajas')pageCash();else if(view==='gastos')pageExpenses();else if(view==='reportes')pageReports();else if(view==='usuarios')pageUsers()}
async function home(){const d=await api('/api/dashboard');shell(`<div class="title"><div><h2>Inicio</h2><div class="muted">Resumen del negocio</div></div></div><div class="grid"><div class="card stat"><b>${d.clients}</b><small>Clientes</small></div><div class="card stat"><b>${d.activeLoans}</b><small>Préstamos activos</small></div><div class="card stat"><b>${money(d.totalCollected)}</b><small>Total cobrado</small></div><div class="card stat"><b>${d.pending}</b><small>Cuotas pendientes</small></div></div><div class="card" style="margin-top:10px"><h3>Control general</h3><div class="two"><div><span class="muted">Gastos registrados</span><br><b>${money(d.totalExpenses)}</b></div><div><span class="muted">Saldo de movimientos</span><br><b>${money(d.systemCash)}</b></div></div></div><div class="card" style="margin-top:10px"><h3>Accesos rápidos</h3><div class="actions"><button class="btn primary" onclick="view='clientes';render()">＋ Nuevo cliente</button><button class="btn secondary" onclick="view='prestamos';render()">💳 Nuevo préstamo</button><button class="btn secondary" onclick="view='cobranza';render()">💰 Cobrar cuota</button>${me.role==='admin'?'<button class="btn secondary" onclick="view=\'cajas\';render()">💵 Administrar cajas</button>':''}</div></div>`)}
function pageClients(){shell(`<div class="title"><div><h2>Clientes</h2><div class="muted">Clientes asignados y ubicación</div></div><button class="btn primary" onclick="newClient()">＋ Nuevo</button></div><input id="search" placeholder="🔎 Buscar cliente..." oninput="filterClients()"><div id="clist" class="list"></div>`);filterClients()}
function filterClients(){const q=(document.getElementById('search')?.value||'').toLowerCase();const arr=clients.filter(c=>[c.name,c.phone,c.address,c.business].join(' ').toLowerCase().includes(q));document.getElementById('clist').innerHTML=arr.map(c=>`<div class="card"><div class="row"><div><h3 style="margin:0">${esc(c.name)}</h3><div class="muted">${esc(c.business||'Sin negocio')} · ${esc(c.phone||'Sin teléfono')}</div></div><span class="tag">${esc(c.cobrador||'Sin cobrador')}</span></div><p class="muted">📍 ${esc(c.address||'Sin dirección')}</p><div class="actions">${c.phone?`<button class="btn secondary" onclick="location.href='tel:${esc(c.phone)}'">📞 Llamar</button>`:''}${c.latitude&&c.longitude?`<button class="btn secondary" onclick="window.open('https://www.google.com/maps?q=${c.latitude},${c.longitude}','_blank')">📍 Mapa</button>`:''}<button class="btn primary" onclick="newLoan(${c.id})">＋ Préstamo</button></div></div>`).join('')||'<div class="card empty">No hay clientes.</div>'}
function modal(title,content){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalbox"><div class="row"><h3>${title}</h3><button class="btn secondary" onclick="modal.remove()">Cerrar</button></div>${content}</div></div>`)}
function newClient(){const opts=users.filter(u=>u.role==='cobrador').map(u=>`<option value="${u.id}">${esc(u.display_name)}</option>`).join('');modal('Nuevo cliente',`<form class="form" onsubmit="saveClient(event)"><label>Nombre completo<input id="cn" required></label><div class="two"><label>Teléfono<input id="cp"></label><label>Negocio<input id="cb"></label></div><label>Dirección<input id="ca"></label><div class="two"><label>Latitud<input id="clat" type="number" step="any"></label><label>Longitud<input id="clon" type="number" step="any"></label></div>${me.role==='admin'||me.role==='supervisor'?`<label>Cobrador<select id="cc"><option value="">Sin asignar</option>${opts}</select></label>`:''}<button class="btn primary">Guardar cliente</button></form>`)}
async function saveClient(e){e.preventDefault();try{await api('/api/clients',{method:'POST',body:JSON.stringify({name:cn.value,phone:cp.value,business:cb.value,address:ca.value,latitude:clat.value||null,longitude:clon.value||null,cobradorId:document.getElementById('cc')?.value||null})});modal.remove();await load();render()}catch(x){alert(x.message)}}
function pageLoans(){shell(`<div class="title"><div><h2>Préstamos</h2><div class="muted">Control de créditos y cuotas</div></div><button class="btn primary" onclick="newLoan()">＋ Nuevo</button></div><div class="list">${loans.map(l=>{const rem=Number(l.total)-Number(l.paid);return `<div class="card"><div class="row"><div><h3 style="margin:0">${esc(l.client_name)}</h3><div class="muted">${l.frequency} · ${l.installments_count} cuotas · ${esc(l.cobrador||'Sin cobrador')}</div></div><span class="tag">${esc(l.status)}</span></div><div class="two" style="margin-top:9px"><div>Préstamo<br><b>${money(l.total)}</b></div><div>Pendiente<br><b>${money(rem)}</b></div></div></div>`}).join('')||'<div class="card empty">No hay préstamos.</div>'}</div>`)}
function newLoan(clientId){const opts=clients.map(c=>`<option value="${c.id}" ${c.id==clientId?'selected':''}>${esc(c.name)}</option>`).join('');const cops=users.filter(u=>u.role==='cobrador').map(u=>`<option value="${u.id}">${esc(u.display_name)}</option>`).join('');modal('Nuevo préstamo',`<form class="form" onsubmit="saveLoan(event)"><label>Cliente<select id="lc" required>${opts}</select></label>${me.role!=='cobrador'?`<label>Cobrador<select id="lco"><option value="">Sin asignar</option>${cops}</select></label>`:''}<div class="two"><label>Monto<input id="lam" type="number" step="0.01" min="0.01" required></label><label>Interés<input id="lint" type="number" step="0.01" min="0" value="0"></label></div><div class="two"><label>Nº cuotas<input id="lcount" type="number" min="1" required></label><label>Frecuencia<select id="lf"><option>Diaria</option><option>Semanal</option><option>Mensual</option></select></label></div><label>Fecha inicial<input id="ls" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><button class="btn primary">Crear préstamo y cuotas</button></form>`)}
async function saveLoan(e){e.preventDefault();try{await api('/api/loans',{method:'POST',body:JSON.stringify({clientId:lc.value,cobradorId:document.getElementById('lco')?.value||null,amount:lam.value,interest:lint.value,installmentsCount:lcount.value,frequency:lf.value,startDate:ls.value})});modal.remove();await load();render()}catch(x){alert(x.message)}}
function pageCollection(){const arr=collection;const pending=arr.filter(i=>Number(i.paid)<Number(i.amount)-.01);shell(`<div class="title"><div><h2>💰 Cobranza</h2><div class="muted">Cuotas pendientes y pagos parciales</div></div></div><div class="card"><b>${pending.length}</b> cuotas pendientes</div><div class="list">${pending.map(i=>{const rem=Number(i.amount)-Number(i.paid);return `<div class="card"><div class="row"><div><b>${esc(i.client_name)}</b><div class="muted">Cuota ${i.number} · vence ${i.due_date} · ${esc(i.address||'')}</div></div><span class="tag">${money(rem)}</span></div><div class="actions"><button class="btn primary" onclick="pay(${i.id},${rem})">Registrar pago</button>${i.phone?`<button class="btn secondary" onclick="location.href='tel:${esc(i.phone)}'">📞</button>`:''}</div></div>`}).join('')||'<div class="card empty">🎉 No hay cuotas pendientes.</div>'}</div>`)}
function pay(id,rem){modal('Registrar cobro',`<form class="form" onsubmit="savePayment(event,${id})"><label>Monto a cobrar<input id="pa" type="number" step="0.01" min="0.01" max="${rem}" value="${rem.toFixed(2)}" required></label><label>Nota<input id="pn" placeholder="Opcional"></label><div class="notice">Máximo para esta cuota: ${money(rem)}. Puedes registrar un pago parcial.</div><button class="btn primary">Confirmar cobro</button></form>`)}
async function savePayment(e,id){e.preventDefault();try{await api('/api/payments',{method:'POST',body:JSON.stringify({installmentId:id,amount:pa.value,note:pn.value})});modal.remove();await load();render()}catch(x){alert(x.message)}}
async function pageCash(){if(me.role==='admin'){cashUsers=await api('/api/cash/users');}const uid=me.role==='admin'?(cashUsers[0]?.id||''):me.id;let data=await api('/api/cash'+(uid?'?userId='+uid:''));const select=me.role==='admin'?`<label>Cobrador<select id="cashsel" onchange="showCash(this.value)">${cashUsers.map(u=>`<option value="${u.id}" ${u.id==data.user.id?'selected':''}>${esc(u.display_name)}</option>`).join('')}</select></label>`:'';shell(`<div class="title"><div><h2>🧾 Cajas individuales</h2><div class="muted">Cada cobrador tiene su propio saldo.</div></div></div>${select}<div id="casharea"></div>`);drawCash(data)}
function drawCash(d){const area=document.getElementById('casharea');area.innerHTML=`<div class="card" style="margin-top:10px"><div class="muted">Caja de</div><h3>${esc(d.user.display_name)}</h3><div class="cash">${money(d.balance)}</div><div class="muted">Saldo actual</div>${me.role==='admin'?`<div class="actions"><button class="btn primary" onclick="inject(${d.user.id})">＋ Inyectar dinero</button><button class="btn secondary" onclick="withdraw(${d.user.id},${d.balance})">↩ Retirar dinero</button></div>`:''}</div><div class="card" style="margin-top:10px"><h3>Movimientos</h3><div class="scroll"><table><tr><th>Fecha</th><th>Tipo</th><th>Monto</th><th>Detalle</th></tr>${d.movements.map(m=>`<tr><td>${new Date(m.created_at).toLocaleString('es-BO')}</td><td>${esc(m.type)}</td><td>${money(m.amount)}</td><td>${esc(m.note||m.expense_description||'')}</td></tr>`).join('')||'<tr><td colspan="4">Sin movimientos.</td></tr>'}</table></div></div>`}
async function showCash(id){drawCash(await api('/api/cash?userId='+id))}
function inject(uid){modal('Inyectar dinero a caja',`<form class="form" onsubmit="doInject(event,${uid})"><label>Monto<input id="ia" type="number" min="0.01" step="0.01" required></label><label>Motivo<input id="in" value="Capital entregado al cobrador"></label><div class="notice">🔐 Solo el administrador puede realizar esta operación.</div><button class="btn primary">Confirmar inyección</button></form>`)}
async function doInject(e,uid){e.preventDefault();try{await api('/api/cash/inject',{method:'POST',body:JSON.stringify({userId:uid,amount:ia.value,note:in.value})});modal.remove();pageCash()}catch(x){alert(x.message)}}
function withdraw(uid,balance){modal('Retirar dinero de caja',`<form class="form" onsubmit="doWithdraw(event,${uid})"><label>Monto<input id="wa" type="number" min="0.01" max="${balance}" step="0.01" required></label><label>Motivo<input id="wn" value="Entrega al administrador"></label><button class="btn primary">Confirmar retiro</button></form>`)}
async function doWithdraw(e,uid){e.preventDefault();try{await api('/api/cash/withdraw',{method:'POST',body:JSON.stringify({userId:uid,amount:wa.value,note:wn.value})});modal.remove();pageCash()}catch(x){alert(x.message)}}
function pageExpenses(){shell(`<div class="title"><div><h2>📤 Gastos</h2><div class="muted">Los gastos quedan registrados en la caja correspondiente.</div></div></div><div class="card"><form class="form" onsubmit="saveExpense(event)">${me.role==='admin'?`<label>Caja del cobrador<select id="eu">${cashUsers.map(u=>`<option value="${u.id}">${esc(u.display_name)}</option>`).join('')}</select></label>`:''}<label>Monto<input id="ea" type="number" min="0.01" step="0.01" required></label><label>Descripción<input id="ed" required></label><button class="btn primary">Registrar gasto</button></form></div>`);if(me.role==='admin'&&!cashUsers.length)api('/api/cash/users').then(x=>{cashUsers=x;pageExpenses()})}
async function saveExpense(e){e.preventDefault();try{await api('/api/expenses',{method:'POST',body:JSON.stringify({amount:ea.value,description:ed.value,userId:document.getElementById('eu')?.value})});alert('Gasto registrado');await load();render()}catch(x){alert(x.message)}}
async function pageReports(){const r=await api('/api/reports/summary');shell(`<div class="title"><div><h2>📊 Reportes</h2><div class="muted">Cobranza de los últimos 30 días</div></div></div><div class="card"><div class="scroll"><table><tr><th>Día</th><th>Pagos</th><th>Cobrado</th></tr>${r.map(x=>`<tr><td>${x.day}</td><td>${x.payments}</td><td>${money(x.collected)}</td></tr>`).join('')||'<tr><td colspan="3">Sin datos.</td></tr>'}</table></div></div>`)}
function pageUsers(){const su=users.filter(u=>u.role==='supervisor');shell(`<div class="title"><div><h2>⚙️ Usuarios</h2><div class="muted">Administra supervisores y cobradores.</div></div><button class="btn primary" onclick="newUser()">＋ Nuevo</button></div><div class="notice">Los cobradores solo trabajan con los clientes y cuotas asignados. Las cajas individuales no pueden recibir inyecciones desde cuentas de cobrador.</div><div class="list">${users.map(u=>`<div class="card"><div class="row"><div><b>${esc(u.display_name)}</b><div class="muted">${esc(u.username)} · ${esc(u.role)}</div></div><span class="tag">${u.active?'Activo':'Inactivo'}</span></div></div>`).join('')}</div>`)}
function newUser(){const su=users.filter(u=>u.role==='supervisor').map(u=>`<option value="${u.id}">${esc(u.display_name)}</option>`).join('');modal('Crear usuario',`<form class="form" onsubmit="saveUser(event)"><label>Nombre<input id="un" required></label><label>Usuario<input id="uu" required></label><label>Contraseña<input id="up" type="password" minlength="6" required></label><label>Rol<select id="ur" onchange="document.getElementById('sup').classList.toggle('hidden',this.value!=='cobrador')"><option value="supervisor">Supervisor</option><option value="cobrador">Cobrador</option></select></label><label id="sup" class="hidden">Supervisor<select id="us">${su}</select></label><button class="btn primary">Crear</button></form>`)}
async function saveUser(e){e.preventDefault();try{await api('/api/users',{method:'POST',body:JSON.stringify({displayName:un.value,username:uu.value,password:up.value,role:ur.value,supervisorId:us?.value||null})});modal.remove();await load();render()}catch(x){alert(x.message)}}
async function logout(){await api('/api/logout',{method:'POST'});me=null;login()}
boot();
</script></body></html>
